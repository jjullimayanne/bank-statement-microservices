global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'orchestrator-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['orchestrator-service:8080']
        labels:
          service: 'orchestrator'
          language: 'java'

  - job_name: 'account-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['account-service:8081']
        labels:
          service: 'account'
          language: 'java'

  - job_name: 'ledger-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ledger-service:8082']
        labels:
          service: 'ledger'
          language: 'java'

  - job_name: 'transaction-service'
    metrics_path: '/api/transactions/metrics'
    static_configs:
      - targets: ['transaction-service:8083']
        labels:
          service: 'transaction'
          language: 'go'

  - job_name: 'exchange-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['exchange-service:8084']
        labels:
          service: 'exchange'
          language: 'python'

  - job_name: 'statement-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['statement-service:8085']
        labels:
          service: 'statement'
          language: 'nodejs'
